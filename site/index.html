<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fef1f2">
<title>Studio HSK 1</title>
<link rel="stylesheet" href="writing.css">
<link rel="stylesheet" href="speaking.css">
<link rel="stylesheet" href="wheel.css">
<link rel="stylesheet" href="annot.css">
<link rel="stylesheet" href="reading.css">
<script>
/* Tema: applicato PRIMA del rendering per evitare il flash.
   Ordine: scelta salvata dall'utente (hsk.theme) > impostazione del sistema. */
(function(){var t=null;try{t=localStorage.getItem("hsk.theme")}catch(e){}
if(t!=="light"&&t!=="dark")t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
document.documentElement.setAttribute("data-theme",t);})();
</script>
<style>
:root{
  --rosa:#fef1f2; --rosso:#d6202b; --inchiostro:#222; --grigio:#6b6b6b;
  --carta:#faf7f2; --linea:#e8e2d8; --bianco:#fff;
  /* --rosso = rosso come TESTO/bordo; --accent = rosso come RIEMPIMENTO (con testo --on-accent) */
  --accent:#d6202b; --on-accent:#fff; --testo2:#444;
  --ok-bg:#e7f6ea; --ok-bd:#2e8b47; --no-bg:#fde8e8; --warn-bg:#fff6e0; --warn-bd:#c98a00;
  color-scheme:light;
  --hanzi:"Noto Sans CJK SC","Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
}
/* Palette notte: stessi toni caldi e stesso rosso della versione diurna, ma su carbone caldo (non nero puro)
   e con un rosso più chiaro per il testo, così i contrasti restano morbidi e leggibili (>= 5:1). */
:root[data-theme="dark"]{
  --rosa:#2f2022; --rosso:#f0777d; --inchiostro:#ece6df; --grigio:#a8a19a;
  --carta:#2a2625; --linea:#403a38; --bianco:#1d1a19;
  --accent:#c93640; --on-accent:#fff; --testo2:#c9c2ba;
  --ok-bg:#1f3527; --ok-bd:#5ab677; --no-bg:#40252a; --warn-bg:#3a3020; --warn-bd:#d9a441;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;color:var(--inchiostro);background:var(--bianco);line-height:1.45}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--rosso);outline-offset:2px}

header{background:var(--rosa);border-bottom:3px solid var(--rosso);padding:18px 24px;display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center;justify-content:space-between}
header h1{font-size:1.45rem;line-height:1.2}
header p{font-size:.85rem;color:var(--grigio)}
.hright{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.theme{display:inline-flex;align-items:center;gap:8px;background:var(--bianco);border:1px solid var(--linea);border-radius:999px;padding:6px 12px 6px 8px;cursor:pointer;font-size:.88rem}
.theme:hover{border-color:var(--rosso)}
.theme .tk{width:36px;height:20px;border-radius:999px;background:var(--grigio);position:relative;flex:none}
.theme .tk::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.theme[aria-checked="true"] .tk{background:var(--accent)}
.theme[aria-checked="true"] .tk::after{transform:translateX(16px)}
@media (prefers-reduced-motion:reduce){.theme .tk::after{transition:none}}
#q{width:min(360px,100%);padding:10px 14px;border:1px solid var(--linea);border-radius:8px;background:var(--bianco);font-size:1rem}

.layout{display:grid;grid-template-columns:270px 1fr;gap:0;max-width:1300px;margin:0 auto}
nav{padding:20px 14px 40px 24px;border-right:1px solid var(--linea);position:sticky;top:0;align-self:start;max-height:100vh;overflow-y:auto}
nav h3{font-size:.95rem;color:var(--rosso);margin:18px 0 6px}
nav h3:first-child{margin-top:0}
nav button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:6px 8px;cursor:pointer;font-size:.92rem}
nav button:hover{background:var(--carta)}
nav button[aria-current="true"]{background:var(--rosa);color:var(--rosso);font-weight:600}
nav .n{color:var(--grigio);font-weight:400}

main{padding:22px 24px 60px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:6px 20px;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.top h2{font-size:1.35rem}
.top span{color:var(--grigio);font-size:.9rem}
.tools{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:20px}
.seg{display:inline-flex;border:1px solid var(--rosso);border-radius:8px;overflow:hidden}
.seg button{background:var(--bianco);border:0;padding:7px 16px;cursor:pointer;color:var(--rosso)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.tools label{display:inline-flex;gap:6px;align-items:center;font-size:.9rem;cursor:pointer}
.btn{background:var(--bianco);border:1px solid var(--linea);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:.9rem}
.btn:hover{border-color:var(--rosso);color:var(--rosso)}
#unitSelect{display:none;padding:8px 10px;border:1px solid var(--linea);border-radius:8px;background:var(--bianco);max-width:100%}

/* schede che si girano */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{perspective:900px;height:236px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--carta);border:1px solid var(--linea);border-radius:10px;padding:14px;overflow:auto}
.back{transform:rotateY(180deg)}
.no{font-size:.75rem;color:var(--grigio)}
.front{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.front .no{position:absolute;left:12px;top:10px}
.hz{font-family:var(--hanzi);font-size:3.4rem;line-height:1.1}
.py{color:var(--rosso);font-size:1.15rem}
.mean{font-weight:700;margin:2px 0 8px}
.ex{font-family:var(--hanzi);font-size:.95rem}
.expy{color:var(--rosso);font-size:.8rem}
.en{font-style:italic;font-size:.82rem;color:var(--testo2)}

/* elenco */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:5rem 1fr;gap:4px 16px;padding:14px 4px;border-bottom:1px solid var(--linea)}
.row .hz{font-size:2.3rem;text-align:center}
.row .where{font-size:.75rem;color:var(--grigio)}
.msg{background:var(--rosa);border-left:4px solid var(--rosso);padding:14px 16px;border-radius:6px;max-width:60ch}
code{background:var(--carta);padding:1px 5px;border-radius:4px}

/* selettore dei livelli */
.shell{display:grid;grid-template-columns:150px 1fr;max-width:1500px;margin:0 auto}
.shell.nolevels{grid-template-columns:1fr}
.shell.nolevels #levels{display:none}
.content{min-width:0}
#levels{padding:20px 12px;position:sticky;top:0;align-self:start;display:flex;flex-direction:column}
.lvl{display:flex;flex-direction:column;gap:2px;text-align:center;background:var(--bianco);border:1.5px solid var(--linea);border-radius:14px;padding:12px 8px;cursor:pointer}
.lvl b{font-size:1.15rem}
.lvl span{font-size:.75rem;color:var(--grigio)}
.lvl .kn{color:var(--rosso)}
.lvl:hover{border-color:var(--rosso)}
.lvl[aria-pressed="true"]{background:var(--rosa);border-color:var(--rosso)}
.lvl[aria-pressed="true"] b{color:var(--rosso)}
.sep{color:var(--rosso);opacity:.6;display:flex;justify-content:center}
.sep .sh{width:100%;height:32px}
.sep .sv{display:none}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  #levels{position:static;flex-direction:row;align-items:center;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--linea)}
  .lvl{flex:none;min-width:104px}
  .sep{flex:none}.sep .sh{display:none}.sep .sv{display:block;width:26px;height:48px}
}
/* quiz */
.tabs{display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:560px){.tabs button{padding:8px 12px;font-size:.92rem}}
.tabs button{background:var(--bianco);border:1px solid var(--rosso);color:var(--rosso);border-radius:8px;padding:8px 18px;cursor:pointer;font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
#quizView,#pronView,#statView{max-width:760px;margin:0 auto;padding:24px 16px 70px}
#quizView h2,#pronView h2,#statView h2{margin-bottom:6px}
#pronView h3,#statView h3{font-size:1.05rem;color:var(--rosso);margin:26px 0 8px}
.srow{display:grid;grid-template-columns:170px 1fr;gap:6px 14px;align-items:center;padding:6px 0;border-bottom:1px solid var(--linea)}
.snd{display:flex;gap:8px;align-items:center;background:var(--carta);border:1px solid var(--linea);border-radius:8px;padding:8px 10px;cursor:pointer;text-align:left}
.snd:hover{border-color:var(--rosso)}
.snd b{color:var(--rosso);min-width:2.4ch}
.snd .h{font-family:var(--hanzi);font-size:1.35rem;margin-left:auto}
.srow span.t{font-size:.92rem}
.rules{padding-left:20px;display:grid;gap:8px;font-size:.95rem}
.dr{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem;min-width:520px}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--linea);text-align:left}
.tbl tr.ph td{background:var(--rosa);font-weight:700;color:var(--rosso)}
.tbl .bar{width:90px;display:inline-block;vertical-align:middle;margin:0 0 0 8px}
.tbl td.pc{width:46px;padding-right:0}
.play{width:34px;height:34px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);cursor:pointer;font-size:.8rem;padding:0 0 0 2px;display:inline-flex;align-items:center;justify-content:center}
.play:hover{opacity:.85}
.tbl tr:hover td{background:var(--carta)}
@media (max-width:520px){.srow{grid-template-columns:1fr}}
.hint{color:var(--grigio);font-size:.9rem;margin:6px 0 14px}
.setup{display:grid;gap:12px;margin:16px 0}
.setup label{display:grid;gap:4px;font-weight:600;font-size:.92rem}
.setup .chk{display:flex;align-items:center;gap:8px;font-weight:600}.plays{margin-left:12px}
.setup select,.qin{padding:10px 12px;border:1px solid var(--linea);border-radius:8px;background:var(--bianco);font-size:1rem;width:100%}
.big{background:var(--accent);color:var(--on-accent);border-color:var(--accent);padding:12px 26px;font-size:1.05rem;font-weight:600}
.big:hover{color:var(--on-accent);opacity:.9}
.bar{height:6px;background:var(--linea);border-radius:3px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:var(--rosso)}
.qbox{background:var(--carta);border:1px solid var(--linea);border-radius:12px;padding:22px 18px;margin:12px 0;text-align:center}
.qbig{font-family:var(--hanzi);font-size:3.6rem;line-height:1.2;overflow-wrap:anywhere}
.qbig.txt{font-family:inherit;font-size:1.5rem;font-weight:700}
.qbig.sen{font-size:1.7rem}
.ask{color:var(--grigio);margin-top:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.opts button{background:var(--bianco);border:1px solid var(--linea);border-radius:10px;padding:14px 10px;cursor:pointer;font-size:1.1rem;min-height:56px}
.opts button.hz2{font-family:var(--hanzi);font-size:1.7rem}
.opts button:hover:not(:disabled){border-color:var(--rosso)}
.opts button.ok,.qin.ok{background:var(--ok-bg);border-color:var(--ok-bd)}
.opts button.no,.qin.no{background:var(--no-bg);border-color:var(--rosso)}
.fb{border-left:4px solid var(--rosso);background:var(--rosa);border-radius:6px;padding:12px 14px;text-align:left;margin-top:14px}
.fb.good{border-color:var(--ok-bd);background:var(--ok-bg)}
.fb b{display:block;margin-bottom:6px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;justify-content:center}
.errs{text-align:left;margin:12px 0;padding-left:20px}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  nav{display:none}
  #unitSelect{display:block;margin-bottom:12px;width:100%}
  header,main{padding-left:16px;padding-right:16px}
}
@media (prefers-reduced-motion:reduce){.inner{transition:none}}
.cr-foot{margin:34px auto 0;padding:14px 16px 26px;border-top:1px solid var(--linea);text-align:center;font-size:.85rem;color:var(--grigio)}
.cr-line{margin-top:30px;font-size:.85rem;color:var(--grigio)}
.cr-link{color:var(--rosso);text-decoration:none;border-bottom:1px solid transparent}
.cr-link:hover,.cr-link:focus-visible{border-bottom-color:currentColor}
.cr-dlg{max-height:calc(100dvh - 32px);overflow:auto;max-width:420px;width:calc(100% - 32px);border:1px solid var(--linea);border-radius:14px;background:var(--bianco);color:var(--inchiostro);padding:20px 22px}
.cr-dlg::backdrop{background:rgba(0,0,0,.5)}
.cr-dlg h2{font-size:1.2rem;margin-bottom:8px}.cr-dlg h3{font-size:1rem;margin:14px 0 6px}
.cr-list{list-style:none;padding:0;display:grid;gap:6px;margin-bottom:14px}
.cr-help{width:36px;padding:7px 0;font-weight:700;text-align:center}
.langsel{padding:7px 8px;border:1px solid var(--linea);border-radius:8px;background:var(--bianco);color:var(--inchiostro);font-size:.88rem}
.hlp{max-width:560px}.hlp-list{display:grid;gap:10px;margin-bottom:14px}.hlp-list dt{font-weight:700;color:var(--rosso)}.hlp-list dd{margin:0}
.lvl.soon{opacity:.72;border-style:dashed}.lvl.soon .kn{opacity:.5}
.card.ph{border:2px dashed var(--linea);background:transparent;min-height:140px;display:flex;align-items:center;justify-content:center;cursor:default;box-shadow:none}
.card.ph .phl{color:var(--grigio);font-size:.85rem;text-align:center;padding:8px}
.reset-box{margin-top:28px;border-top:1px dashed var(--linea);padding-top:14px}
.reset-box p{margin:4px 0 10px}
</style>
</head>
<body>
<header>
  <div>
    <h1 id="appTitle">Studio HSK 1</h1>
    <p id="appSub">300 parole del nuovo syllabus, in ordine di studio</p>
  </div>
  <div class="tabs" role="group" aria-label="Sezione" data-i18n-aria="Sezione">
    <button id="tabStudia" aria-pressed="true" data-i18n="Studia">Studia</button>
    <button id="tabPron" aria-pressed="false" data-i18n="Pronuncia">Pronuncia</button>
    <button id="tabEsercizi" aria-pressed="false" data-i18n="Esercizi">Esercizi</button>
    <button id="tabStat" aria-pressed="false" data-i18n="Statistiche">Statistiche</button>
  </div>
  <div class="hright">
    <input id="q" type="search" placeholder="Cerca in hanzi, pinyin o italiano" data-i18n-ph="Cerca in hanzi, pinyin o italiano" aria-label="Cerca una parola" data-i18n-aria="Cerca una parola" autocomplete="off">
    <button id="themeBtn" class="theme" type="button" role="switch" aria-checked="false" aria-label="Modalità scura" data-i18n-aria="Modalità scura"><span class="tk" aria-hidden="true"></span><span data-i18n="Scuro">Scuro</span></button>
    <select id="langSel" class="langsel" aria-label="Lingua" data-i18n-aria="Lingua"><option value="it">Italiano</option><option value="en">English</option><option value="es">Español</option></select>
  </div>
</header>

<div class="shell" id="shell">
<aside id="levels" aria-label="Livello HSK" data-i18n-aria="Livello HSK"></aside>
<div class="content">
<div class="layout">
  <nav id="nav" aria-label="Unità di studio" data-i18n-aria="Unità di studio"></nav>
  <main>
    <select id="unitSelect" aria-label="Scegli un’unità" data-i18n-aria="Scegli un’unità"></select>
    <div class="top"><h2 id="title">Tutte le parole</h2><span id="count"></span></div>
    <p class="hint" id="levelNote" hidden></p>
    <div class="tools">
      <div class="seg" role="group" aria-label="Modalità di visualizzazione" data-i18n-aria="Modalità di visualizzazione">
        <button id="vSchede" aria-pressed="true" data-i18n="Schede">Schede</button>
        <button id="vElenco" aria-pressed="false" data-i18n="Elenco">Elenco</button>
      </div>
      <label id="pyWrap"><input type="checkbox" id="pyFront" checked> <span data-i18n="Pinyin sul fronte">Pinyin sul fronte</span></label>
      <button class="btn" id="flipAll">Gira tutte</button>
    </div>
    <div id="grid" class="cards"></div>
  </main>
</div>
<section id="exView" hidden></section>
<section id="quizView" hidden aria-live="polite"></section>
<section id="pronView" hidden></section>
<section id="readView" hidden></section>
<section id="writeView" hidden></section>
<section id="speakView" hidden></section>
<section id="statView" hidden></section>
</div>
</div>

<script src="audio.js"></script>

<script src="i18n/es.js"></script>
<script src="config.js"></script>
<script src="credits.js"></script>
<script src="detector.js"></script>
<script src="files.js"></script>
<script src="writing.js"></script>

<script src="wave.js"></script>

<script src="wheel.js"></script>

<script>
// Livelli disponibili e percorso dei file dati (relativi a site/index.html).
// Per aggiungere un livello basta una riga qui sotto e il relativo file JSON.
// n = numero di parole (null = vocabolario non ancora pronto: il livello compare come segnaposto, il file JSON è vuoto).
// i18n = file con i significati in italiano/inglese/spagnolo (e gli esempi tradotti) da unire alle schede.
const LEVELS = [
  { id: "hsk1", label: "HSK 1", n: 300, file: "../data/flashcards.json", i18n: "../data/i18n/cards_hsk1.json" },
  { id: "hsk2", label: "HSK 2", n: 200, file: "../data/flashcards_hsk2.json", i18n: "../data/i18n/cards_hsk2.json" },
  { id: "hsk3", label: "HSK 3", n: 500, file: "../data/flashcards_hsk3.json", i18n: "../data/i18n/cards_hsk3.json" },
  { id: "hsk4", label: "HSK 4", n: null, file: "../data/flashcards_hsk4.json" },
  { id: "hsk5", label: "HSK 5", n: null, file: "../data/flashcards_hsk5.json" },
  { id: "hsk6", label: "HSK 6", n: null, file: "../data/flashcards_hsk6.json" },
  { id: "hsk79", label: "HSK 7–9", n: null, file: "../data/flashcards_hsk79.json" }];

const $ = s => document.querySelector(s);
const norm = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const pad = n => String(n).padStart(3, "0");
const mean = c => I18n.pick(c, "meaning");                                   // significato nella lingua scelta
const U = n => {
  const m = /^Lettera (\w+)$/.exec(n || ""); if (m) return T("Lettera {x}", { x: m[1] });
  const t = T(n); if (t !== n) return t;
  const u = /^(\d{2}) (.+)$/.exec(n || ""); return u ? u[1] + " " + T(u[2]) : t;        // "NN Tema": il numero resta, il nome si traduce
};   // nomi di fasi e unità (dati in italiano)
const exTr = ex => (ex && (ex[I18n.lang] || ex.en || ex.it)) || "";           // traduzione dell'esempio
function el(tag, cls, txt) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt !== undefined && txt !== null) e.textContent = txt;
  return e;
}

/* ================= TEMA ================= */
const THEME_KEY = "hsk.theme", mqDark = window.matchMedia ? matchMedia("(prefers-color-scheme: dark)") : null;
const storedTheme = () => { try { const t = localStorage.getItem(THEME_KEY); return t === "light" || t === "dark" ? t : null; } catch (e) { return null; } };
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  $("#themeBtn").setAttribute("aria-checked", String(t === "dark"));
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = t === "dark" ? "#1d1a19" : "#fef1f2";
}
applyTheme(document.documentElement.getAttribute("data-theme") || (mqDark && mqDark.matches ? "dark" : "light"));
$("#themeBtn").addEventListener("click", () => {
  const t = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  applyTheme(t); try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
});
// Finché l'utente non sceglie a mano, si segue il sistema (anche se cambia mentre la pagina è aperta).
const onSys = e => { if (!storedTheme()) applyTheme(e.matches ? "dark" : "light"); };
if (mqDark) { if (mqDark.addEventListener) mqDark.addEventListener("change", onSys); else if (mqDark.addListener) mqDark.addListener(onSys); }

let cards = [], unit = "all", view = "schede", showPinyin = true, query = "";
const flipped = new Set();

let level = "hsk1", curTab = "studia"; const cache = {};
try { const l = localStorage.getItem("hsk.level"); if (LEVELS.some(x => x.id === l)) level = l; } catch (e) {}
function readProg(id) {

// Carica (e mette in cache) i dati di un livello; usata anche dalla sezione Scrittura per il lessico.
function fetchLevel(L) {
  if (cache[L.id]) return Promise.resolve(cache[L.id]);
  const side = L.i18n ? fetch(L.i18n).then(r => r.ok ? r.json() : {}).catch(() => ({})) : Promise.resolve({});
  return Promise.all([fetch(L.file).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }), side]).then(([d, tr]) => {
    // unisce le traduzioni: ogni scheda ottiene meaning_it/en/es e example.it/en/es (se mancano, si ripiega sulla lingua disponibile)
    d.forEach(c => {
      const t = tr[c.id] || {}, m = t.meaning || {};
      ["it", "en", "es"].forEach(l => { if (m[l]) c["meaning_" + l] = m[l]; });
      if (c.example) { c.example = Object.assign({}, c.example); ["it", "es"].forEach(l => { if (t.example && t.example[l]) c.example[l] = t.example[l]; }); }
    });
    return (cache[L.id] = d.sort((a, b) => a.order - b.order));
  });
}

// Progressi salvati nel browser (Leitner: ogni risposta giusta allunga l’intervallo di ripasso).
let LS = "hsk.progress.hsk1", DAY = 864e5, GAP = [0, 1, 2, 4, 8, 16, 32];
let prog = {};
const saveProg = () => { try { localStorage.setItem(LS, JSON.stringify(prog)); } catch (e) {} };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const qv = $("#quizView");
let S = null;

const MODES = ["mix", "h2m", "m2h", "h2p", "aud", "typ", "clz"];
const MODE_LABEL = { mix: "Misto adattivo (consigliato)", h2m: "Hanzi → significato", m2h: "Significato → hanzi", h2p: "Hanzi → pinyin e toni", aud: "Ascolta e scegli l’hanzi", typ: "Scrivi il pinyin", clz: "Completa la frase" };

// Pinyin: accetta toni come segni (nǐ) o numeri (ni3); u: e v valgono ü.
const TM = { a: "āáǎà", e: "ēéěè", i: "īíǐì", o: "ōóǒò", u: "ūúǔù", "ü": "ǖǘǚǜ" };
function canon(s) {
  s = s.normalize("NFC").toLowerCase().replace(/[\s'’\-]/g, "").replace(/u:|v/g, "ü");
  return s.replace(/([a-zü]+?)([0-5])/g, (m, syl, t) => {
    t = +t; if (t < 1 || t > 4) return syl;
    let i = syl.indexOf("a"); if (i < 0) i = syl.indexOf("e");
    if (i < 0 && syl.includes("ou")) i = syl.indexOf("o");
    if (i < 0) for (let k = syl.length - 1; k >= 0; k--) if ("aeiouü".includes(syl[k])) { i = k; break; }
    return i < 0 ? syl : syl.slice(0, i) + TM[syl[i]][t - 1] + syl.slice(i + 1);
  }).normalize("NFC");
}
const pinyinOk = (given, target) => target.split("/").some(t => canon(t) === canon(given));

/* ---- AUDIO (sintesi vocale) --------------------------------------------------------------
 * Perché prima serviva un "test audio": (1) Safari/iOS e Chrome bloccano la sintesi finché non c'è un gesto dell'utente
 * (un tocco/clic) e la prima parola veniva persa; (2) le voci si caricano in modo asincrono; (3) il ripiego sulla voce
 * partiva dentro un evento "error" dell'<audio>, cioè fuori dal gesto, e il browser lo bloccava; (4) cancel() subito
 * prima di speak() faceva perdere la frase. Ora: voci caricate subito (con attesa di voiceschanged), "sblocco" automatico
 * al primo tocco/tasto della pagina, nessun cancel() inutile e il ripiego parte in modo sincrono. */
let ZH = null, audioReady = false;
const hasTTS = "speechSynthesis" in window;
function pickVoice() {
  if (!hasTTS) return;
  const q = v => (/natural|neural|online|google|xiaoxiao|yunxi|ting-?ting|mei-?jia/i.test(v.name) ? 2 : 0) + (/zh[-_]CN/i.test(v.lang) ? 1 : 0);
  ZH = speechSynthesis.getVoices().filter(v => /^zh/i.test(v.lang)).sort((a, b) => q(b) - q(a))[0] || null;
  const n = document.getElementById("voiceName");
  if (n) n.textContent = ZH ? T("Voce in uso: {n} ({l})", { n: ZH.name, l: ZH.lang }) : T("Nessuna voce cinese trovata: installa una voce cinese nelle impostazioni del sistema per sentire i suoni.");
}
function unlockAudio() {                       // eseguito una sola volta, dentro il primo gesto dell'utente
  if (audioReady || !hasTTS) return; audioReady = true;
  try { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; u.lang = "zh-CN"; speechSynthesis.speak(u); speechSynthesis.resume(); } catch (e) {}
  pickVoice();
}
if (hasTTS) {
  pickVoice(); speechSynthesis.addEventListener("voiceschanged", pickVoice);
  // le voci possono comparire con ritardo: riprova qualche volta finché non ce n'è una cinese
  let tries = 0; const iv = setInterval(() => { if (ZH || ++tries > 10) clearInterval(iv); else pickVoice(); }, 400);
  ["pointerdown", "touchend", "keydown", "click"].forEach(ev => window.addEventListener(ev, unlockAudio, { once: true, capture: true, passive: true }));
}
function speak(t) {
  if (!hasTTS || !t) return;
  unlockAudio();
  if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang = "zh-CN"; u.rate = 0.8; if (ZH) u.voice = ZH;
  speechSynthesis.resume(); speechSynthesis.speak(u);
}
// "mǎ" → "ma3", "nǚ" → "nv3", "ma" → "ma5"
function numPinyin(p) {
  const T = { "\u0304": 1, "\u0301": 2, "\u030c": 3, "\u0300": 4 }; let t = 5, o = "";
  for (const ch of p.normalize("NFD").toLowerCase()) { if (T[ch]) t = T[ch]; else if (ch === "\u0308") o = o.slice(0, -1) + "v"; else if (/[a-z]/.test(ch)) o += ch; }
  return o + t;
}
// AudioKit usa un file di site/audio/ solo se elencato in audio/manifest.json (vedi site/audio/README.md); altrimenti la voce del browser,
// subito e dentro il gesto dell'utente, così il suono parte al primo tocco.
function playSound(py, h) { AudioKit.play("syllables/" + numPinyin(py), h, speak); }

// Quattro risposte: i distrattori sono scelti tra parole simili (stessa unità, o pinyin con la stessa base ma toni diversi).
function choices(c, key) {
  const val = x => key === "meaning" ? mean(x) : x[key];
  const t = val(c), b = norm(t);
  const cand = shuffle(cards.filter(x => x.id !== c.id && val(x) !== t));
  cand.sort((x, y) => (key === "pinyin" ? (norm(val(y)) === b) - (norm(val(x)) === b) : 0) || (y.unit === c.unit) - (x.unit === c.unit));
  const out = [], seen = new Set([t]);
  for (const x of cand) { if (!seen.has(val(x))) { seen.add(val(x)); out.push(x); } if (out.length === 3) break; }
  return shuffle([c, ...out]).map(x => ({ label: val(x), ok: x.id === c.id }));
}

function makeQ(c, mode) {
  const box = (prog[c.id] || {}).box || 0; let t = mode;
  if (t === "mix") { const P = box < 2 ? ["h2m", "h2p", "aud"] : box < 4 ? ["m2h", "aud", "clz", "h2p"] : ["typ", "m2h", "clz", "aud"]; t = P[Math.floor(Math.random() * P.length)]; }
  if (t === "aud" && !("speechSynthesis" in window) && !(S && S.exam)) t = "h2p";
  if (t === "clz" && !(c.example && c.example.zh && c.example.zh.includes(c.hanzi))) t = "m2h";
  const q = { c, t, hz: false };
  if (t === "h2m") Object.assign(q, { big: c.hanzi, ask: T("Che cosa significa?"), opts: choices(c, "meaning") });
  if (t === "m2h") Object.assign(q, { big: mean(c), txt: true, ask: T("Qual è l’hanzi?"), hz: true, opts: choices(c, "hanzi") });
  if (t === "h2p") Object.assign(q, { big: c.hanzi, ask: T("Qual è il pinyin, con i toni giusti?"), opts: choices(c, "pinyin") });
  if (t === "aud") Object.assign(q, { big: "🔊", ask: T("Ascolta e scegli l’hanzi corretto"), hz: true, opts: choices(c, "hanzi"), audio: c.hanzi });
  if (t === "typ") Object.assign(q, { big: c.hanzi, ask: T("Scrivi il pinyin con i toni (puoi usare i numeri: ni3 hao3). Significato: {m}", { m: mean(c) }) });
  if (t === "clz") Object.assign(q, { big: c.example.zh.replace(c.hanzi, "＿＿"), sen: true, ask: T("Completa la frase. {t}", { t: exTr(c.example) }), hz: true, opts: choices(c, "hanzi") });
  return q;
}

}

function startQuiz(mode, scope, n, only, exam) {
  const now = Date.now(), rank = c => !prog[c.id] ? 1 : prog[c.id].due <= now ? 0 : 2;
  let pool = only || (scope === "all" || scope === "smart" ? cards : cards.filter(c => c.unit === scope));
  if (!only) {
    pool = [...pool].sort((a, b) => rank(a) - rank(b) || (rank(a) === 1 ? a.order - b.order : prog[a.id].due - prog[b.id].due));
    if (scope === "smart") { const f = pool.filter(c => rank(c) < 2); pool = f.length ? f : pool; }
    if (n) pool = pool.slice(0, n);
  }
  if (!pool.length) { qv.replaceChildren(el("p", "msg", T("Non ci sono parole da ripassare in questa selezione."))); return; }
  S = { exam: exam || null, mode, scope, queue: shuffle([...pool]), i: 0, score: 0, total: pool.length, seen: new Set(), again: new Set(), wrong: [], done: false };
  showQ();
}

function showQ() {
  if (S.i >= S.queue.length) return showResult();
  const q = S.cur = makeQ(S.queue[S.i], S.mode); S.done = false; qv.replaceChildren();
  const bar = el("div", "bar"), fill = el("i"); fill.style.width = (100 * S.i / S.queue.length) + "%"; bar.append(fill);
  qv.append(el("div", "hint", T("Domanda {i} di {n}", { i: S.i + 1, n: S.queue.length })), bar);
  const box = el("div", "qbox");
  box.append(el("div", "qbig" + (q.txt ? " txt" : "") + (q.sen ? " sen" : ""), q.big), el("div", "ask", q.ask));
  if (q.audio) {
    // L'audio parte SOLO dal clic su questo pulsante. In modalità esame il numero di ascolti è limitato.
    const lim = S.exam ? S.exam.plays : Infinity; let used = 0;
    const b = el("button", "btn big", ""), cnt = el("span", "hint plays"); cnt.setAttribute("aria-live", "polite");
    const upd = () => { const left = lim - used; b.textContent = left > 0 ? "▶ " + T("Ascolta") : T("Ascolti esauriti"); b.disabled = left <= 0; cnt.textContent = S.exam ? T("Ascolti rimasti: {n} su {t}", { n: Math.max(0, left), t: lim }) : ""; };
    b.addEventListener("click", () => { if (used >= lim) return; used++; upd(); try { speak(q.audio); } catch (e) { console.warn("audio:", e); } });
    upd(); box.append(el("div", "acts")); box.lastChild.append(b, cnt);
  }
  if (q.opts) {
    const g = el("div", "opts");

function answer(ok, node) {
  if (S.done) return; S.done = true;
  const c = S.cur.c, q = S.cur;
  if (!S.seen.has(c.id)) {
    S.seen.add(c.id);
    const p = prog[c.id] || { box: 0, due: 0, n: 0, miss: 0 };
    p.n++; if (ok) { p.box = Math.min(p.box + 1, GAP.length - 1); } else { p.box = 0; p.miss++; S.wrong.push(c); }
    p.due = Date.now() + GAP[p.box] * DAY; prog[c.id] = p; saveProg();
    if (ok) S.score++;
  }
  if (!ok && !S.again.has(c.id)) { S.again.add(c.id); S.queue.push(c); }  // riproposta a fine sessione
  if (q.opts) qv.querySelectorAll(".opts button").forEach((b, k) => { b.disabled = true; if (q.opts[k].ok) b.classList.add("ok"); else if (b === node) b.classList.add("no"); });
  else { node.disabled = true; node.classList.add(ok ? "ok" : "no"); qv.querySelector(".btn.big").style.display = "none"; }
  const fb = el("div", "fb" + (ok ? " good" : ""));
  fb.append(el("b", "", ok ? T("Corretto!") : T("Non proprio. Ecco la risposta giusta:")));
  fb.append(el("div", "", `${c.hanzi}  ${c.pinyin}: ${mean(c)}`));
  if (c.example) { fb.append(el("div", "ex", c.example.zh), el("div", "expy", c.example.pinyin), el("div", "en", exTr(c.example))); }
  const acts = el("div", "acts"), hear = el("button", "btn", T("Ascolta")), nx = el("button", "btn big", T("Avanti"));
  hear.addEventListener("click", () => speak(c.hanzi)); nx.addEventListener("click", () => { S.i++; showQ(); });
  acts.append(hear, nx); qv.append(fb, acts); nx.focus();
}

function agg(cs) {
  const now = Date.now(), a = { n: cs.length, seen: 0, known: 0, due: 0, tries: 0, miss: 0 };
  cs.forEach(c => { const p = prog[c.id]; if (!p) return; a.seen++; if (p.box >= 4) a.known++; if (p.due <= now) a.due++; a.tries += p.n; a.miss += p.miss; });
  return a;
}

  const rowOf = (label, a, cls) => {

    tr.append(el("td", "", label), el("td", "", a.seen + "/" + a.n), k, el("td", "", a.due), el("td", "", a.tries ? Math.round(100 * (a.tries - a.miss) / a.tries) + "%" : "–"));

  const t = el("table", "tbl"), hd = el("tr");
  ["Area", "Viste", "Consolidate", "Da ripassare", "Precisione"].forEach(x => hd.append(el("th", "", T(x))));

    const cur = items.find(i => i.key === curTab) || items[0], bar = el("div", "ex-bar"), slot = el("div"), ttl = el("h2", "", cur.label), back = el("button", "btn", "☰ " + T("Menu esercizi"));
    back.type = "button"; back.addEventListener("click", () => showTab("esercizi"));
    bar.append(slot, ttl, back); xv.append(bar);
    wheelH = Wheel.mount(slot, { items, current: cur.key, mini: true, onSelect: k => { if (k !== curTab) showTab(k); } });
  }
}
function showTab(t) {
  curTab = t; const top = isEx(t) ? "esercizi" : t, inEx = top === "esercizi";
  $("#shell").classList.toggle("nolevels", t === "pron"); if (t !== "pron") drawLevels();
  document.querySelector(".layout").style.display = t === "studia" ? "" : "none";
  xv.hidden = !inEx; qv.hidden = t !== "quiz"; pv.hidden = t !== "pron"; tv.hidden = t !== "stat"; rv.hidden = t !== "leggi"; wv.hidden = t !== "scrivi"; sv.hidden = t !== "parla";
  if (t !== "leggi" && window.Reading) Reading.hide();
  if (t !== "parla" && window.Speaking) Speaking.hide();
  $("#q").style.visibility = t === "studia" ? "visible" : "hidden";
  Object.entries(TABS).forEach(([k, id]) => $("#" + id).setAttribute("aria-pressed", String(k === top)));
  if (inEx) exView();
  const wait = () => el("p", "msg", T("I dati non sono ancora caricati."));
  if (t === "pron" && !pv.childElementCount) buildPron();
  if (t === "quiz" && !S) { cache[level] ? quizMenu() : qv.replaceChildren(wait()); }
  if (t === "stat") { cache[level] ? statsView() : tv.replaceChildren(wait()); }
  if (t === "leggi" && FE.reading) Reading.show();
  if (t === "scrivi") Writing.show();
  if (t === "parla" && FE.speaking) Speaking.show();
  window.scrollTo({ top: 0 });
}
Object.entries(TABS).forEach(([k, id]) => $("#" + id).addEventListener("click", () => showTab(k)));
/* ================= LINGUA ================= */
function relang() {                      // ridisegna tutto ciò che è dinamico quando cambia la lingua
  I18n.apply(); setHeader(); drawLevels();
  const L = LEVELS.find(x => x.id === level), n = $("#levelNote");
  if (!n.hidden) n.textContent = T("Il vocabolario di questo livello non è ancora disponibile. Questa è un’anteprima dell’impaginazione: quando aggiungerai le parole al file JSON del livello, compariranno qui.");
  buildNav(); render(); pv.replaceChildren(); document.title = "Studio HSK";
  if (curTab === "pron") buildPron();
  if (curTab === "quiz" && !S) quizMenu();
  if (curTab === "stat") statsView();
  if (curTab === "leggi" && FE.reading) Reading.refresh();
  if (curTab === "scrivi") Writing.refresh();
  if (curTab === "parla" && FE.speaking) Speaking.refresh();
  if (curTab === "esercizi" || isEx(curTab)) exView();
  if (window.Credits) Credits.refresh();
}
$("#langSel").value = I18n.lang;
$("#langSel").addEventListener("change", e => I18n.set(e.target.value));
I18n.onChange(relang);
I18n.apply();
loadLevel(level);
</script>
